name: Keep alive

# Both free tiers idle out, and the failure modes are user-visible:
#   - Render sleeps the API after ~15 minutes, costing the next visitor a
#     ~30 second cold start.
#   - Supabase pauses a project after ~1 week with no queries, after which the
#     connection pooler reports "tenant/user not found" and the site is simply
#     broken until someone resumes it from the dashboard.
#
# One request resets both timers.
#
# GitHub's scheduled runners are best-effort and can lag by tens of minutes
# under load, so this reliably solves the weekly Supabase pause but only mostly
# keeps Render warm. If cold starts matter — a link on a CV, say — pair this
# with an external monitor such as UptimeRobot on a 5 minute interval.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # so it can be triggered by hand after a pause

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake the API and check its dependencies
        run: |
          # --max-time 90 rather than the default: a cold Render instance can
          # take well over a minute to answer, and that request is the point.
          response=$(curl -sS --max-time 90 --retry 2 --retry-delay 20 \
            -w '\n%{http_code}' \
            https://foodjet-api.onrender.com/api/v1/health)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Health check returned $status"
            exit 1
          fi

          # A 200 only means the process is up. The database is the thing that
          # actually pauses, so assert on it rather than on the status code.
          if ! echo "$body" | grep -q '"database":{"status":"up"'; then
            echo "::error::API is up but the database is not reachable — the Supabase project may be paused"
            exit 1
          fi
