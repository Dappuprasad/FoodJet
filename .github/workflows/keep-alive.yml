name: Keep alive

# Both free tiers idle out, but only one of the two failures actually matters:
#
#   - Supabase pauses a project after ~1 week with no queries. The pooler then
#     answers "tenant/user not found" and the site is broken until somebody
#     resumes it from the dashboard. That is an outage, and it has happened.
#   - Render sleeps the service after ~15 minutes, costing the next visitor a
#     ~50 second cold start. Slow, but it recovers on its own.
#
# The interval is deliberately days, not minutes. Render's free tier allows 750
# instance-hours per month across the whole account, and a ping every ten
# minutes never lets the service sleep — burning ~730 hours on one app and
# leaving nothing for any other. Running every two days sits comfortably inside
# Supabase's week while costing only a few hours a month, so the allowance stays
# available for real visitors across every service on the account.
#
# The trade is deliberate: cold starts are accepted, silent database death is
# not. If cold starts ever matter more than the hour budget, raise the frequency
# knowing what it spends.

on:
  schedule:
    - cron: '0 3 */2 * *' # 03:00 UTC, every second day
  workflow_dispatch: # so it can be triggered by hand after a pause

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake the API and check its dependencies
        run: |
          # --max-time 90 rather than the default: a cold Render instance can
          # take well over a minute to answer, and that request is the point.
          response=$(curl -sS --max-time 90 --retry 2 --retry-delay 20 \
            -w '\n%{http_code}' \
            https://foodjet-api.onrender.com/api/v1/health)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Health check returned $status"
            exit 1
          fi

          # A 200 only means the process is up. The database is the thing that
          # actually pauses, so assert on it rather than on the status code.
          if ! echo "$body" | grep -q '"database":{"status":"up"'; then
            echo "::error::API is up but the database is not reachable — the Supabase project may be paused"
            exit 1
          fi
